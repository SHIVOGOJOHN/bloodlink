{% extends "base.html" %}
{% block title %}Reset password - BloodLink{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-header">
    <h1 class="page-title">Reset your password</h1>
    <p class="page-subtitle">Choose a new password for your account.</p>
  </div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label" for="password">New password</label>
      <div class="password-field">
        <input id="password" type="password" name="password" class="form-control" autocomplete="new-password" required minlength="8">
        <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">
          <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 3 18 18"/><path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-4.8"/><path d="M9.9 4.4A10.5 10.5 0 0 1 12 4.2c6.5 0 10 7.8 10 7.8a18.4 18.4 0 0 1-3.1 4.2"/><path d="M6.6 6.6A18.3 18.3 0 0 0 2 12s3.5 7.8 10 7.8c1.6 0 3-.4 4.2-1"/></svg>
        </button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm password</label>
      <div class="password-field">
        <input id="confirm_password" type="password" name="confirm_password" class="form-control" autocomplete="new-password" required minlength="8">
        <button type="button" class="password-toggle" data-password-toggle="confirm_password" aria-label="Show password">
          <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 3 18 18"/><path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-4.8"/><path d="M9.9 4.4A10.5 10.5 0 0 1 12 4.2c6.5 0 10 7.8 10 7.8a18.4 18.4 0 0 1-3.1 4.2"/><path d="M6.6 6.6A18.3 18.3 0 0 0 2 12s3.5 7.8 10 7.8c1.6 0 3-.4 4.2-1"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Update password</button>
  </form>
</div>
{% endblock %}
