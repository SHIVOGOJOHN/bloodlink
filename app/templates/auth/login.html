{% extends "base.html" %}
{% block title %}Log in - BloodLink{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-header">
    <h1 class="page-title">Welcome back</h1>
    <p class="page-subtitle">Use Google or email to continue to your BloodLink workspace.</p>
  </div>

  <a href="{{ url_for('auth.google_auth') }}?action=login" class="google-btn" id="google-link">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continue with Google
  </a>

  <div class="auth-choice">
    <span aria-hidden="true"></span>
    <button type="button" class="auth-method-toggle" data-auth-toggle="email-login">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      or log in with email
    </button>
    <span aria-hidden="true"></span>
  </div>

  <form method="post" id="email-login" class="auth-email-panel {% if request.method == 'POST' %}active{% endif %}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input id="email" type="email" name="email" class="form-control" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="password-field">
        <input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required>
        <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">
          <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 3 18 18"/><path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-4.8"/><path d="M9.9 4.4A10.5 10.5 0 0 1 12 4.2c6.5 0 10 7.8 10 7.8a18.4 18.4 0 0 1-3.1 4.2"/><path d="M6.6 6.6A18.3 18.3 0 0 0 2 12s3.5 7.8 10 7.8c1.6 0 3-.4 4.2-1"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100 mb-2">Log in</button>
    <a href="{{ url_for('auth.forgot_password') }}" class="btn-link w-100">Forgot password?</a>
  </form>
  <p class="auth-alt-link">Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
</div>
{% endblock %}
