{% extends "base.html" %}
{% block title %}Forgot password - BloodLink{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-header">
    <h1 class="page-title">Forgot your password?</h1>
    <p class="page-subtitle">Enter your account email and BloodLink will send a reset link through Gmail SMTP.</p>
  </div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input id="email" type="email" name="email" class="form-control" autocomplete="email" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary w-100 mb-2">Send reset link</button>
    <a href="{{ url_for('auth.login') }}" class="btn btn-secondary w-100">Back to login</a>
  </form>
</div>
{% endblock %}
