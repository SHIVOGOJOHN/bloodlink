{% extends "base.html" %}
{% block title %}Page Not Found — BloodLink{% endblock %}

{% block content %}
<div class="row justify-content-center text-center">
  <div class="col-md-8 col-lg-6">
    <div class="card-container py-5 my-5">
      <div style="font-size: 4rem; font-weight: 700; color: var(--red); line-height: 1;" class="mb-3">404</div>
      <h1 class="page-title mb-2">Page Not Found</h1>
      <p class="text-muted mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
      <a href="{{ url_for('index') }}" class="btn btn-primary px-4">Go to Homepage</a>
    </div>
  </div>
</div>
{% endblock %}
